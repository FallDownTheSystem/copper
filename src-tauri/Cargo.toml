[package]
name = "copper"
version = "0.1.0"
description = "Copper — a Windows note-capture panel"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# The project's real floor, and it does not come from Tauri: Tauri 2.11.5's own
# MSRV is 1.77.2, but task-003 brings in notify-debouncer-full 0.7.0, which
# declares 1.85.0. Declared here so Phase 2 does not discover it.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "copper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Pinned exactly, not a caret range. The `windows = "=0.61.3"` alignment below is
# only sound because Tauri 2.11.5 itself depends on windows 0.61; a later 2.x
# that moved to 0.62 would silently resolve a second copy of the crate and break
# the no-cast HWND boundary. `tray-icon` is required for TrayIconBuilder and is
# not on by default.
tauri = { version = "=2.11.5", features = ["tray-icon"] }
window-vibrancy = "0.8"
windows = { version = "=0.61.3", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
