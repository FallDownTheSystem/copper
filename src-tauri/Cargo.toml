[package]
name = "copper"
version = "0.1.2"
description = "Copper — a Windows note-capture panel"
authors = ["FallDownTheSystem"]
# `version` is the single source of truth for the whole product: tauri.conf.json
# omits its own `version` key and inherits this one, so the installer filename,
# the Add/Remove Programs entry and `app.package_info().version` all move
# together when this line is bumped.
#
# `license` stays unset rather than being given a value: the repository carries
# no LICENSE file, and declaring a licence in metadata that nothing in the tree
# grants would be a claim with nothing behind it. `publish = false` says the part
# that is actually true — this crate is never going to crates.io — and is what
# stops cargo asking for the licence it would otherwise require.
repository = "https://github.com/FallDownTheSystem/copper"
publish = false
edition = "2021"
# The project's real floor, and it does not come from Tauri: Tauri 2.11.5's own
# MSRV is 1.77.2, but task-003 brings in notify-debouncer-full 0.7.0, which
# declares 1.85.0. Declared here so Phase 2 does not discover it.
rust-version = "1.85"

[lib]
name = "copper_lib"
# Desktop-only: the binary links the rlib. `staticlib` and `cdylib` exist for the
# mobile targets this app cannot build — it depends unconditionally on `windows`
# and DWM — and cargo writes both on every build of the lib crate: a 70 MB archive
# in release, 706 MB in debug.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Pinned exactly, not a caret range. The `windows = "=0.61.3"` alignment below is
# only sound because Tauri 2.11.5 itself depends on windows 0.61; a later 2.x
# that moved to 0.62 would silently resolve a second copy of the crate and break
# the no-cast HWND boundary. `tray-icon` is required for TrayIconBuilder and is
# not on by default.
tauri = { version = "=2.11.5", features = ["tray-icon"] }
window-vibrancy = "0.8"
windows = { version = "=0.61.3", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_System_Diagnostics_Debug",
	"Win32_UI_WindowsAndMessaging",
	# --- capture (task-005) ---
	# Win32_Graphics_Gdi is not obviously needed and is easy to drop by mistake:
	# windows-rs puts RegisterClassW and WNDCLASSW behind it, because WNDCLASSW
	# embeds HICON/HCURSOR/HBRUSH. Without it the clipboard owner window — the
	# thing that stops EmptyClipboard from nulling the owner and failing every
	# SetClipboardData — cannot be created at all.
	"Win32_Graphics_Gdi",
	"Win32_Security",
	# --- spaces (task-007) ---
	# GetLogicalDrives, for the one availability check that is safe to make
	# without touching the filesystem: a drive letter that is simply not there.
	# Probing a path beneath it reports ERROR_PATH_NOT_FOUND, which is
	# indistinguishable from a deleted file.
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_DataExchange",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Threading",
	"Win32_UI_Accessibility",
	"Win32_UI_Input_KeyboardAndMouse",
	# --- capture notifications (task-018) ---
	# Features, not a new crate. `tauri-winrt-notification` is a thin wrapper over
	# exactly these four APIs, but its current release moved to windows 0.62 and
	# would resolve the second, semver-incompatible copy of `windows` the `=0.61.3`
	# pin above exists to prevent — pinning it to the last 0.61-compatible version
	# instead buys convenience for a pin that rots the moment Tauri moves.
	#
	# `Data_Xml_Dom` is the toast payload (XmlDocument), `Foundation` is
	# TypedEventHandler — the activation callback, and the whole reason the plugin
	# cannot do this — and `UI_Notifications` is ToastNotification itself.
	# `Foundation_Collections` is deliberately absent: it gates only
	# `ToastActivatedEventArgs::UserInput`, and this toast has no input fields.
	"Data_Xml_Dom",
	"Foundation",
	"UI_Notifications",
] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"

# --- distribution (task-009) ---
# Exact, not a caret range, and for a sharper reason than the usual pin: three
# behaviours this task is built around are implementation details rather than API
# — the Windows install path calling `std::process::exit(0)` after launching the
# installer, the signature being verified during the download rather than during
# the check, and `check()` hardcoding `timeout: None` into the `Update` it
# returns. A minor bump could change any of them without changing a signature.
#
# `zip` is one of the two default features and is dropped deliberately. It exists
# for `createUpdaterArtifacts: "v1Compatible"`, which wraps the installer in a zip
# for v1-era clients; this app sets `true` and ships the `-setup.exe` itself, so
# the plugin's `extract_zip` branch is unreachable and the `zip` crate would be
# compiled and linked for a path no release takes. `rustls-tls` has to be named
# because dropping the defaults drops reqwest's TLS provider with them.
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls"] }

# --- store (task-003) ---
# notify 8.2 is the current stable line; 9.x is still an unpromoted release
# candidate. notify-debouncer-full 0.7.0 is the release that pairs with it, and
# it is what moved this crate's rust-version to 1.85.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# NamedTempFile::new_in + persist/persist_noclobber. The temp file must live in
# the destination's own directory: persist is a rename and cannot cross volumes.
tempfile = "3.27"
# No serde feature on purpose — timestamps are opaque `String` in the model
# (spec 1.2), so a hand-edited one cannot make a document unloadable.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# --- spaces (task-007) ---
# Driven from Rust only, so there is no npm package and no capability entry: the
# plugin hands back a path and every read and write still goes through the store.
tauri-plugin-dialog = "2.7.2"

# --- attachments (task-011) ---
# `infer` and `sha2` are already in the tree beneath Tauri, so these two ranges
# are chosen to resolve to the copies that are there rather than to the newest
# releases: `infer` is at 0.22 and `sha2` at 0.11, and asking for either would
# add a second copy of a crate the binary already links. The same
# single-version rule the `windows` pin exists for, applied one level down.
infer = "0.19"
sha2 = "0.10"
# Genuinely new, and the only large one. The feature set is narrowed to the
# formats attachments can actually be: default features pull in every decoder
# `image` has, most of a megabyte of code for TIFF, DDS, EXR and HDR that no
# clipboard paste or file drop in this app will ever produce. `bmp` is not
# cosmetic — a clipboard DIB is a BMP body without its file header, and
# prepending one is how a paste is decoded at all.
image = { version = "0.25.10", default-features = false, features = [
	"png",
	"jpeg",
	"gif",
	"webp",
	"bmp",
] }

# --- link previews (task-020) ---
# All three name copies that are already in the tree rather than adding a stack,
# the same single-version rule `infer` and `sha2` are pinned under.
#
# `reqwest` arrives beneath `tauri-plugin-updater`, which enables exactly
# `__rustls`, `rustls-no-provider`, `json` and `stream`. `default-features =
# false` is not optional here: reqwest's defaults are `default-tls`, `charset`,
# `http2` and `system-proxy`, and the first of those would resolve a second TLS
# provider (aws-lc-rs) beside the ring one the updater already installs.
# `charset` stays off deliberately — it would add `encoding_rs`, a large table
# crate, so `Response` bytes are decoded as lossy UTF-8 and a windows-1252 or
# Shift_JIS page yields mojibake in its title. That is the documented limit.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Named only to install the crypto provider. `rustls-no-provider` means reqwest
# ships none, and `ClientBuilder::build` **panics** rather than erring when no
# process default has been installed — the updater installs `ring` before its own
# first request, so a preview fetched before any update check would be the panic.
# `default-features = false` for the same reason as above: rustls' defaults would
# turn on `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The HTML parser, reached today through `tauri-utils`' compression feature. It
# is html5ever underneath, which decodes character references while parsing — the
# thing a regex over `<meta>` cannot do, alongside attribute order, `name` versus
# `property`, unquoted values and `<meta>` inside a comment.
dom_query = "0.27"

# --- recycle bin (task-015) ---
# Deliberately empty. The attachment sweep moved collected blobs to the Recycle
# Bin through the `trash` crate for exactly one commit, and the mechanism was
# withdrawn: IFileOperation with FOF_ALLOWUNDO permanently deletes and reports
# S_OK when the shell cannot recycle, so the recovery window did not exist for
# the users it was written for. The sweep renames into a `.collected` directory
# now (see attachments::quarantine), which needs no dependency at all — and
# dropping `trash` also drops the second, semver-incompatible copy of `windows`
# it pulled in against the `=0.61.3` pin above, and the CoInitializeEx panic it
# would have taken the process down with.

[profile.release]
# The no-unwrap()-in-setup() reasoning in lib.rs is about release behaviour, so
# the release profile has to actually be the one described. Panic hooks still run
# before the abort, which is what keeps diagnostics::install_panic_dialog useful.
panic = "abort"
