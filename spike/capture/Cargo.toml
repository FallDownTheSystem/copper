[package]
name = "capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Copper Phase 0 capture spike — throwaway evidence-gathering binary, not product code."

[lib]
name = "capture"
path = "src/lib.rs"

[[bin]]
name = "capture-spike"
path = "src/main.rs"

[dependencies]
# Pinned exactly: 0.61.3 is the newest non-yanked 0.61 (0.61.0 and 0.61.2 are yanked).
# NOT 0.62 — Tauri 2.11.5 pins windows 0.61, and two semver-incompatible copies of the
# crate give two non-unifying HWND newtypes at the Phase 4 merge. See task Notes.
windows = { version = "=0.61.3", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Accessibility",
	"Win32_System_DataExchange",
	"Win32_System_Com",
	"Win32_System_Memory",
	"Win32_System_Threading",
	"Win32_Security",
	"Win32_System_LibraryLoader",
	"Win32_System_Registry",
	# Not in dsgn-001's list, and required: windows-rs gates RegisterClassW and
	# WNDCLASSW behind it (WNDCLASSW embeds HICON/HCURSOR/HBRUSH), and the
	# clipboard owner window cannot be created without registering a class.
	"Win32_Graphics_Gdi",
] }
windows-core = "0.61"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
