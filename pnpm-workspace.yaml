allowBuilds:
  # Pulled in transitively by reka-ui's @vueuse/core. Its postinstall is what
  # selects the Vue 3 build; blocked, the package resolves to a stub and every
  # reka-ui import fails at runtime.
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
overrides:
  vite: 'catalog:'
  # Vue 3.6 is still prerelease (latest is 3.5.x). Pinning only "vue" is not
  # enough: library peers resolve stable @vue/runtime-* and the app ends up with
  # two Vue runtimes, which shows up as reactivity silently not tracking across a
  # component boundary. Every runtime and compiler package must move together.
  vue: 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
peerDependencyRules:
  allowAny:
    - vite
    - vue
  allowedVersions:
    vite: '*'
